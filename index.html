<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>探金小秘書</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <!-- Babel for JSX -->
    <script crossorigin src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

</head>
<body class="bg-slate-100 text-slate-800 font-sans antialiased">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useMemo, useEffect } = React;
        const generateId = () => Math.random().toString(36).substr(2, 9);

        // ==========================================
        // 🔑 API 相關設定
        // ==========================================
        const apiKey = "AQ.Ab8RN6IMdhfb8qKSu32xbAp2VpyGqm0Op7RfAE8KJu2bcslkgQ"; 
        // ==========================================

        const PERSONNEL_EXPENSE_OPTIONS = ['加班費', '獎金', '補貼油錢', '補貼餐費', '補貼房租', '其他'];

        const INITIAL_SETTINGS = {
          fixedPersonnel: [
            { name: '帥志', fullDayRate: 2500, halfDayRate: 1300 },
            { name: '阿童', fullDayRate: 2500, halfDayRate: 1300 },
            { name: '阿和', fullDayRate: 2500, halfDayRate: 1300 },
            { name: '阿翔', fullDayRate: 2500, halfDayRate: 1300 },
            { name: '阿孝', fullDayRate: 2500, halfDayRate: 1300 }
          ],
          companyName: '',
          taxId: '',
          phone: ''
        };

        const getDefaultBillingDate = (yearMonthStr) => {
          if (!yearMonthStr) return new Date().toISOString().split('T')[0];
          const [y, m] = yearMonthStr.split('-');
          let nextYear = parseInt(y, 10);
          let nextMonth = parseInt(m, 10) + 1;
          if (nextMonth > 12) { nextMonth = 1; nextYear += 1; }
          const mStr = String(nextMonth).padStart(2, '0');
          return `${nextYear}-${mStr}-05`;
        };

        const emptyRecordForm = () => {
          const defaultMonth = new Date().toISOString().slice(0, 7);
          return {
            id: null,
            type: 'contract', 
            projectName: '',
            date: new Date().toISOString().split('T')[0],
            startTime: '08:00',
            endTime: '17:00',
            location: '',
            client: '',
            personnel: [],
            personnelExtras: [], 
            tasks: [],
            customItems: [], 
            images: [], // 新增：保存照片的陣列
            manualBilling: '',
            billingDate: getDefaultBillingDate(defaultMonth),
            collectionDate: '',
            isCollected: false,
            costs: {
              fuel: { cost: 0, billable: false, billingAmount: 0 },
              food: { cost: 0, billable: false, billingAmount: 0 },
              other: { cost: 0, billable: false, billingAmount: 0 }
            },
            remarks: ''
          };
        };

        // 自動兼容舊資料格式
        const sanitizeRecord = (record) => {
          if (!record) return emptyRecordForm();
          
          let migratedExtras = Array.isArray(record.personnelExtras) ? [...record.personnelExtras] : [];
          let migratedPersonnel = [];

          (Array.isArray(record.personnel) ? record.personnel : []).forEach(p => {
             if (p.overtimePay > 0) migratedExtras.push({ id: generateId(), name: p.name, type: '加班費', amount: p.overtimePay, billable: p.billable });
             if (p.bonus > 0) migratedExtras.push({ id: generateId(), name: p.name, type: '獎金', amount: p.bonus, billable: p.billable });
             
             migratedPersonnel.push({
                 id: p.id, name: p.name, isFixed: p.isFixed, dayType: p.dayType || 'full', dailyRate: p.dailyRate, billable: p.billable
             });
          });

          return {
            ...emptyRecordForm(),
            ...record,
            costs: {
              fuel: { cost: 0, billable: false, billingAmount: 0, ...(record.costs?.fuel || {}) },
              food: { cost: 0, billable: false, billingAmount: 0, ...(record.costs?.food || {}) },
              other: { cost: 0, billable: false, billingAmount: 0, ...(record.costs?.other || {}) }
            },
            personnel: migratedPersonnel,
            personnelExtras: migratedExtras,
            tasks: Array.isArray(record.tasks) ? record.tasks : [],
            customItems: Array.isArray(record.customItems) ? record.customItems : [],
            images: Array.isArray(record.images) ? record.images : [] // 新增：兼容舊資料的圖片欄位
          };
        };

        const TIME_OPTIONS = [];
        for (let h = 0; h < 24; h++) {
          const hourStr = String(h).padStart(2, '0');
          TIME_OPTIONS.push(`${hourStr}:00`);
          TIME_OPTIONS.push(`${hourStr}:30`);
        }

        // 新增：圖片壓縮工具，避免 LocalStorage 爆滿
        const resizeAndCompressImage = (file) => {
            return new Promise((resolve) => {
                const reader = new FileReader();
                reader.onload = (e) => {
                    const img = new Image();
                    img.onload = () => {
                        const canvas = document.createElement('canvas');
                        let width = img.width;
                        let height = img.height;
                        const MAX_SIZE = 800; // 限制最大邊長為 800px

                        if (width > height) {
                            if (width > MAX_SIZE) {
                                height *= MAX_SIZE / width;
                                width = MAX_SIZE;
                            }
                        } else {
                            if (height > MAX_SIZE) {
                                width *= MAX_SIZE / height;
                                height = MAX_SIZE;
                            }
                        }
                        
                        canvas.width = width;
                        canvas.height = height;
                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(img, 0, 0, width, height);
                        // 輸出壓縮後的 JPEG (品質 0.6)
                        resolve(canvas.toDataURL('image/jpeg', 0.6));
                    };
                    img.src = e.target.result;
                };
                reader.readAsDataURL(file);
            });
        };

        const callGeminiAPI = async (text) => {
          if (!apiKey) throw new Error("請先填入有效的 API 金鑰");

          const systemPrompt = "你是一個專業的工程紀錄助理。請從以下工程日誌中提取資訊，並回傳格式嚴謹的 JSON 物件。時間請一律轉換為 24 小時制（HH:mm格式）。";
          const userQuery = `
            日誌內容：
            ${text}

            JSON 結構必須完全符合以下格式，未提及的數字請填 0，字串請留空：
            {
              "type": "contract",
              "projectName": "工程名稱",
              "date": "YYYY-MM-DD",
              "client": "請款對象/客戶",
              "personnel": [
                { "name": "人名", "dayType": "full" 或 "half", "dailyRate": 數字, "billable": false }
              ],
              "personnelExtras": [
                { "name": "人名", "type": "加班費 或是 獎金 或是 其他", "amount": 數字, "billable": false }
              ],
              "tasks": [
                { "description": "工作項目描述", "laborCost": 數字, "materialCost": 數字, "billingAmount": 數字, "billable": false }
              ],
              "customItems": [
                { "name": "物品名稱", "qty": 數字, "price": 數字, "billable": false }
              ],
              "costs": {
                "fuel": { "cost": 數字, "billable": false, "billingAmount": 數字 },
                "food": { "cost": 數字, "billable": false, "billingAmount": 數字 },
                "other": { "cost": 數字, "billable": false, "billingAmount": 數字 }
              }
            }
          `;

          const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-3.6-flash:generateContent?key=${apiKey}`;
          
          let response;
          for (let attempt = 0; attempt < 5; attempt++) {
            response = await fetch(url, {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ 
                contents: [{ parts: [{ text: userQuery }] }],
                systemInstruction: { parts: [{ text: systemPrompt }] }
              })
            });
            if (response.ok) break;
            await new Promise(r => setTimeout(r, Math.pow(2, attempt) * 1000));
          }

          if (!response || !response.ok) throw new Error('API 請求失敗，請檢查金鑰或網路連線');

          const data = await response.json();
          let resultText = data.candidates?.[0]?.content?.parts?.[0]?.text;
          if (!resultText) throw new Error('AI 未回傳任何內容');

          resultText = resultText.replace(/```json/g, '').replace(/```/g, '').trim();
          return JSON.parse(resultText);
        };

        const SoftIcon = ({ type, className = "w-5 h-5" }) => {
            const baseProps = { className, fill: "none", stroke: "currentColor", strokeWidth: "2", strokeLinecap: "round", strokeLinejoin: "round" };
            switch(type) {
                case 'input': return <svg {...baseProps} viewBox="0 0 24 24"><path d="M12 5v14M5 12h14" /></svg>;
                case 'billing': return <svg {...baseProps} viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/><polyline points="10 9 9 9 8 9"/></svg>;
                case 'salary': return <svg {...baseProps} viewBox="0 0 24 24"><rect x="2" y="7" width="20" height="14" rx="2" ry="2"/><path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"/></svg>;
                case 'quotation': return <svg {...baseProps} viewBox="0 0 24 24"><path d="M14.5 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7.5L14.5 2z"/><polyline points="14 2 14 8 20 8"/><path d="M16 13H8"/><path d="M16 17H8"/><path d="M10 9H8"/></svg>;
                case 'monthly': return <svg {...baseProps} viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>;
                case 'stats': return <svg {...baseProps} viewBox="0 0 24 24"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg>;
                case 'settings': return <svg {...baseProps} viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06-.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>;
                default: return null;
            }
        };

        const Card = ({ children, title, className = "", onClick }) => (
          <div className={`bg-white rounded-xl shadow-2xs border border-slate-200/80 overflow-hidden ${className}`} onClick={onClick}>
            {title && (
              <div className="px-4 py-3 border-b border-slate-100 bg-slate-50/70 flex justify-between items-center">
                <h3 className="font-bold text-slate-800 text-xs uppercase tracking-wider">{title}</h3>
              </div>
            )}
            <div className="p-3 sm:p-4">{children}</div>
          </div>
        );

        function App() {
          const [activeTab, setActiveTab] = useState('input');
          const [editingRecord, setEditingRecord] = useState(null);
          
          // 狀態管理：放大圖片的彈出視窗
          const [zoomedImage, setZoomedImage] = useState(null);

          const [records, setRecords] = useState(() => {
            const saved = localStorage.getItem('engineering_records');
            return saved ? JSON.parse(saved) : [];
          });

          const [settings, setSettings] = useState(() => {
            const saved = localStorage.getItem('engineering_settings');
            if (saved) {
              const parsed = JSON.parse(saved);
              if (parsed.fixedPersonnel && typeof parsed.fixedPersonnel[0] === 'string') {
                parsed.fixedPersonnel = parsed.fixedPersonnel.map(name => ({ name, fullDayRate: 2500, halfDayRate: 1300 }));
              }
              return { ...INITIAL_SETTINGS, ...parsed };
            }
            return INITIAL_SETTINGS;
          });
          
          const [toastMessage, setToastMessage] = useState('');
          const [deleteTarget, setDeleteTarget] = useState(null);
          
          const [officialInvoiceModal, setOfficialInvoiceModal] = useState(null);
          const [officialSalaryModal, setOfficialSalaryModal] = useState(null);
          const [officialQuotationModal, setOfficialQuotationModal] = useState(null);

          useEffect(() => {
            // 由於 localStorage 有 5MB 限制，若儲存失敗時給予提示
            try {
                localStorage.setItem('engineering_records', JSON.stringify(records));
            } catch (e) {
                if (e.name === 'QuotaExceededError') {
                    showToast('儲存空間已滿！請刪除舊資料或減少照片數量。');
                }
            }
          }, [records]);

          useEffect(() => {
            localStorage.setItem('engineering_settings', JSON.stringify(settings));
          }, [settings]);

          const showToast = (msg) => {
            setToastMessage(msg);
            setTimeout(() => setToastMessage(''), 3000);
          };

          const handleSaveRecord = (recordData) => {
            if (recordData.id) {
              setRecords(prev => prev.map(r => r.id === recordData.id ? recordData : r));
              showToast('紀錄已更新！');
            } else {
              const newRecord = { ...recordData, id: generateId() };
              setRecords(prev => [newRecord, ...prev]);
              showToast('紀錄已儲存！');
            }
            setEditingRecord(null);
            setActiveTab(recordData.type === 'quotation' ? 'quotation' : 'monthly');
          };

          const handleStartEdit = (record) => {
            setEditingRecord(record);
            setActiveTab('input');
            window.scrollTo({ top: 0, behavior: 'smooth' });
          };

          const confirmDeleteRecord = () => {
            if (!deleteTarget) return;
            setRecords(prev => prev.filter(r => r.id !== deleteTarget));
            setToastMessage('紀錄已刪除');
            setDeleteTarget(null);
          };

          const updateSettings = (newSettings) => {
            setSettings(newSettings);
            showToast('設定已更新！');
          };

          const handleUpdateRecord = (updated) => {
            setRecords(prev => prev.map(r => r.id === updated.id ? updated : r));
          };

          const navItems = [
            { id: 'input', icon: <SoftIcon type="input" />, label: '新增' },
            { id: 'billing', icon: <SoftIcon type="billing" />, label: '請款' },
            { id: 'salary', icon: <SoftIcon type="salary" />, label: '薪資' },
            { id: 'quotation', icon: <SoftIcon type="quotation" />, label: '報價' },
            { id: 'monthly', icon: <SoftIcon type="monthly" />, label: '報表' },
            { id: 'stats', icon: <SoftIcon type="stats" />, label: '統計' },
            { id: 'settings', icon: <SoftIcon type="settings" />, label: '設定' }
          ];

          return (
            <div className="min-h-screen bg-slate-100 text-slate-800 font-sans relative pb-[calc(5rem+env(safe-area-inset-bottom))] md:pb-10">
              
              {/* 照片放大顯示 Modal */}
              {zoomedImage && (
                <div 
                  className="fixed inset-0 bg-slate-900/95 backdrop-blur-sm z-[100] flex items-center justify-center p-2 sm:p-6" 
                  onClick={() => setZoomedImage(null)}
                >
                    <button 
                      className="absolute top-4 right-4 sm:top-6 sm:right-6 text-white bg-black/50 hover:bg-black/80 rounded-full w-10 h-10 flex items-center justify-center text-xl font-bold cursor-pointer transition-colors z-[101]" 
                      onClick={() => setZoomedImage(null)}
                    >
                      ✕
                    </button>
                    <img 
                      src={zoomedImage} 
                      className="max-w-full max-h-[90vh] object-contain rounded shadow-2xl scale-100 animate-[pulse_0.2s_ease-out_1]" 
                      onClick={(e) => e.stopPropagation()} 
                      alt="放大照片"
                    />
                </div>
              )}

              {toastMessage && (
                <div className="fixed top-4 right-4 bg-slate-900 text-white px-3.5 py-2 rounded-lg shadow-lg z-50 text-xs font-medium">
                  {toastMessage}
                </div>
              )}

              {deleteTarget && (
                <div className="fixed inset-0 bg-slate-900/60 backdrop-blur-3xs flex items-center justify-center z-50 p-4">
                  <div className="bg-white rounded-xl shadow-lg p-5 w-full max-w-xs border border-slate-200">
                    <h3 className="text-base font-bold text-slate-900 mb-1">確定要刪除？</h3>
                    <p className="text-xs text-slate-500 mb-4">此動作無法還原。</p>
                    <div className="flex justify-end gap-2">
                      <button onClick={() => setDeleteTarget(null)} className="px-3 py-1.5 text-xs text-slate-600 hover:bg-slate-100 rounded-lg font-medium cursor-pointer">取消</button>
                      <button onClick={confirmDeleteRecord} className="px-3 py-1.5 text-xs bg-rose-600 text-white hover:bg-rose-700 rounded-lg font-medium cursor-pointer">確定刪除</button>
                    </div>
                  </div>
                </div>
              )}

              {/* 📱 產生正式請款單彈出視窗 */}
              {officialInvoiceModal && (
                <div className="fixed inset-0 bg-slate-900/80 backdrop-blur-xs flex justify-center items-start z-50 p-2 sm:p-4 pt-14 sm:pt-16 overflow-y-auto">
                  <div className="bg-white rounded-xl shadow-2xl w-full max-w-2xl flex flex-col border border-slate-200 overflow-hidden mb-6 h-fit shrink-0">
                    <div className="flex justify-between items-center px-3 py-2 bg-slate-900 text-white shrink-0 sticky top-0 z-10">
                      <h3 className="font-bold text-[11px] sm:text-xs">請款單預覽</h3>
                      <button onClick={() => setOfficialInvoiceModal(null)} className="text-slate-300 hover:text-white font-bold px-2 py-1 cursor-pointer">✕</button>
                    </div>

                    <div className="p-3 bg-white text-slate-800 space-y-2 text-[10px]">
                      <div className="text-center pb-2 border-b-2 border-slate-900">
                        <h2 className="text-base font-black text-slate-900 tracking-wider mb-0.5">{settings.companyName || '工程行'}</h2>
                        <div className="text-[9px] text-slate-600 font-medium space-x-2">
                          {settings.taxId && <span>統一編號：{settings.taxId}</span>}
                          {settings.phone && <span>電話：{settings.phone}</span>}
                        </div>
                        <h1 className="text-sm font-bold text-blue-700 mt-1.5 tracking-widest uppercase">請 款 單</h1>
                      </div>

                      <div className="flex justify-between items-start bg-slate-50 p-2 rounded-lg border border-slate-200">
                        <div className="space-y-0.5">
                          <p><strong className="text-slate-500">客戶抬頭：</strong> <span className="font-bold text-slate-900 text-[11px]">{officialInvoiceModal.client}</span></p>
                          <p><strong className="text-slate-500">請款月份：</strong> <span className="font-mono font-bold text-slate-700">{officialInvoiceModal.month}</span></p>
                        </div>
                        <div className="text-right space-y-0.5">
                          <p><strong className="text-slate-500">填表日期：</strong> <span className="font-mono">{new Date().toISOString().slice(0, 10)}</span></p>
                        </div>
                      </div>

                      <div className="grid grid-cols-2 sm:grid-cols-4 gap-1.5 text-center">
                        <div className="bg-slate-50 p-1.5 rounded-lg border border-slate-200"><span className="text-[9px] text-slate-400 block font-bold">工費總計</span><span className="font-extrabold text-slate-800">${officialInvoiceModal.totalLabor.toLocaleString()}</span></div>
                        <div className="bg-slate-50 p-1.5 rounded-lg border border-slate-200"><span className="text-[9px] text-slate-400 block font-bold">料錢總計</span><span className="font-extrabold text-slate-800">${officialInvoiceModal.totalMaterial.toLocaleString()}</span></div>
                        <div className="bg-slate-50 p-1.5 rounded-lg border border-slate-200"><span className="text-[9px] text-slate-400 block font-bold">各項費用</span><span className="font-extrabold text-slate-800">${officialInvoiceModal.totalExpenses.toLocaleString()}</span></div>
                        <div className="bg-slate-50 p-1.5 rounded-lg border border-slate-200"><span className="text-[9px] text-slate-400 block font-bold">小計金額</span><span className="font-extrabold text-blue-600">${officialInvoiceModal.grandTotal.toLocaleString()}</span></div>
                      </div>

                      <div className="space-y-1">
                        <h4 className="font-bold text-slate-700 uppercase tracking-wider text-[10px]">工程明細列表</h4>
                        <div className="border border-slate-200 rounded-lg overflow-x-auto hide-scrollbar">
                          <table className="w-full min-w-full text-left border-collapse text-[9px] sm:text-[10px]">
                            <thead>
                              <tr className="bg-slate-900 text-white font-bold whitespace-nowrap">
                                <th className="px-2 py-1.5">日期</th>
                                <th className="px-2 py-1.5 w-full">工程/摘要</th>
                                <th className="px-2 py-1.5 text-center">人數</th>
                                <th className="px-2 py-1.5 text-right">工錢</th>
                                <th className="px-2 py-1.5 text-right">其他費</th>
                                <th className="px-2 py-1.5 text-right">總額</th>
                              </tr>
                            </thead>
                            <tbody className="divide-y divide-slate-100">
                              {officialInvoiceModal.records.map((r, idx) => {
                                const pCount = (r.personnel || []).length;
                                let labor = 0;
                                (r.personnel || []).forEach(p => { labor += Number(p.dailyRate)||0; });
                                (r.personnelExtras || []).forEach(pe => { labor += Number(pe.amount)||0; });
                                (r.tasks || []).forEach(t => { labor += Number(t.laborCost)||0; });

                                let exp = 0;
                                ['fuel', 'food', 'other'].forEach(k => { exp += Number(r.costs?.[k]?.cost) || 0; });

                                const desc = r.tasks?.[0]?.description || r.remarks || officialInvoiceModal.projectName;

                    onClick={() => { if(tab.id==='input') setEditingRecord(null); setActiveTab(tab.id); }} 
                    className={`flex flex-col items-center justify-center py-1 min-w-[45px] rounded text-[10px] cursor-pointer ${activeTab === tab.id ? 'text-blue-600 font-bold scale-110 transition-transform' : 'text-slate-400 font-medium hover:text-slate-600'}`}
                  >
                    <span className="mb-1 flex items-center justify-center">{tab.icon}</span>
                    <span>{tab.label}</span>
                  </button>
                ))}
              </nav>
            </div>
          );
        }

        function InputView({ onSave, settings, initialData, onCancelEdit, showToast }) {
          const [formData, setFormData] = useState(() => sanitizeRecord(initialData));
          const [aiText, setAiText] = useState('');
          const [isAiLoading, setIsAiLoading] = useState(false);
          const [aiError, setAiError] = useState('');

          useEffect(() => {
            setFormData(sanitizeRecord(initialData));
          }, [initialData]);

          const handleAIFill = async () => {
            if (!aiText.trim()) return;
            setIsAiLoading(true);
            setAiError('');
            try {
              const result = await callGeminiAPI(aiText);
              setFormData(prev => ({
                ...prev,
                ...result,
                personnel: (result.personnel || []).map(p => ({ 
                  ...p, 
                  id: generateId(), 
                  isFixed: settings.fixedPersonnel.some(fp => fp.name === p.name) || p.isFixed,
                  dayType: p.dayType || 'full',
                  dailyRate: p.dailyRate || 2500,
                  billable: false 
                })),
                personnelExtras: (result.personnelExtras || []).map(pe => ({
                  ...pe,
                  id: generateId(),
                  billable: false
                })),
                tasks: (result.tasks || []).map(t => ({ 
                  ...t, 
                  id: generateId(),
                  billable: false 
                })),
                customItems: (result.customItems || []).map(c => ({ 
                  ...c, 
                  id: generateId(),
                  billable: false 
                })),
                costs: {
                  fuel: { cost: result.costs?.fuel?.cost || 0, billable: false, billingAmount: result.costs?.fuel?.billingAmount || 0 },
                  food: { cost: result.costs?.food?.cost || 0, billable: false, billingAmount: result.costs?.food?.billingAmount || 0 },
                  other: { cost: result.costs?.other?.cost || 0, billable: false, billingAmount: result.costs?.other?.billingAmount || 0 }
                }
              }));
            } catch (error) {
              setAiError(error.message || 'AI 解析失敗');
            } finally {
              setIsAiLoading(false);
            }
          };

          const handleInputChange = (field, value) => {
            setFormData(prev => {
              const updated = { ...prev, [field]: value };
              if (field === 'date' && value) {
                const ym = value.slice(0, 7);
                updated.billingDate = getDefaultBillingDate(ym);
              }
              return updated;
            });
          };
          
          const handleCostDetailChange = (costKey, field, value) => {
            setFormData(prev => ({
              ...prev,
              costs: {
                ...prev.costs,
                [costKey]: {
                  ...prev.costs[costKey],
                  [field]: field === 'billable' ? value : (Number(value) || 0)
                }
              }
            }));
          };

          const addFixedPersonnel = (fp) => {
            const isAlreadyAdded = formData.personnel.some(p => p.name === fp.name);
            if (isAlreadyAdded) {
              setFormData(prev => ({ ...prev, personnel: prev.personnel.filter(p => p.name !== fp.name) }));
            } else {
              setFormData(prev => ({ 
                ...prev, 
                personnel: [...prev.personnel, { id: generateId(), name: fp.name, isFixed: true, dayType: 'full', dailyRate: fp.fullDayRate || 2500, billable: false }] 
              }));
            }
          };

          const addPersonnel = (isFixed, name = '') => setFormData(prev => ({ 
            ...prev, 
            personnel: [...prev.personnel, { id: generateId(), name, isFixed, dayType: 'full', dailyRate: 2500, billable: false }] 
          }));

          const updatePersonnel = (id, field, value) => {
            setFormData(prev => ({ 
              ...prev, 
              personnel: prev.personnel.map(p => {
                if (p.id !== id) return p;
                let updated = { ...p };
                if (field === 'dayType') {
                  updated.dayType = value;
                  const matchedFp = settings.fixedPersonnel.find(fp => fp.name === p.name);
                  if (matchedFp) {
                    updated.dailyRate = value === 'full' ? matchedFp.fullDayRate : matchedFp.halfDayRate;
                  }
                } else if (field === 'name' || field === 'billable') {
                  updated[field] = value;
                } else {
                  updated[field] = Number(value) || 0;
                }
                return updated;
              }) 
            }));
          };

          const removePersonnel = (id) => setFormData(prev => ({ ...prev, personnel: prev.personnel.filter(p => p.id !== id) }));

          const addPersonnelExtra = () => {
             const defaultName = formData.personnel.length > 0 ? formData.personnel[0].name : '';
             setFormData(prev => ({
                ...prev,
                personnelExtras: [...prev.personnelExtras, { id: generateId(), name: defaultName, type: '加班費', amount: 0, billable: false }]
             }));
          };
          const updatePersonnelExtra = (id, field, value) => {
             setFormData(prev => ({
                 ...prev,
                 personnelExtras: prev.personnelExtras.map(pe => pe.id === id ? { ...pe, [field]: field === 'amount' ? (Number(value)||0) : value } : pe)
             }));
          };
          const removePersonnelExtra = (id) => setFormData(prev => ({ ...prev, personnelExtras: prev.personnelExtras.filter(pe => pe.id !== id) }));


          const addTask = () => setFormData(prev => ({ 
            ...prev, 
            tasks: [...prev.tasks, { id: generateId(), description: '', laborCost: 0, materialCost: 0, billingAmount: 0, billable: false }] 
          }));
          const updateTask = (id, field, value) => setFormData(prev => ({ 
            ...prev, 
            tasks: prev.tasks.map(t => t.id === id ? { ...t, [field]: field === 'description' || field === 'billable' ? value : (Number(value) || 0) } : t) 
          }));
          const removeTask = (id) => setFormData(prev => ({ ...prev, tasks: prev.tasks.filter(t => t.id !== id) }));

          const addCustomItem = () => setFormData(prev => ({
            ...prev,
            customItems: [...prev.customItems, { id: generateId(), name: '', qty: 1, price: 0, billable: false }]
          }));
          const updateCustomItem = (id, field, value) => setFormData(prev => ({
            ...prev,
            customItems: prev.customItems.map(c => c.id === id ? { ...c, [field]: field === 'name' || field === 'billable' ? value : (Number(value) || 0) } : c)
          }));
          const removeCustomItem = (id) => setFormData(prev => ({
            ...prev,
            customItems: prev.customItems.filter(c => c.id !== id)
          }));

          // 新增：處理照片上傳與壓縮
          const handleImageUpload = async (e) => {
            const files = Array.from(e.target.files);
            if (!files.length) return;

            // 檢查是否超過 9 張限制
            if (formData.images.length + files.length > 9) {
               showToast('每筆紀錄最多只能上傳 9 張照片！');
               // 截斷多餘檔案
               files.splice(9 - formData.images.length);
            }
            
            showToast('照片壓縮處理中...');

            try {
                const compressedImages = await Promise.all(files.map(file => resizeAndCompressImage(file)));
                setFormData(prev => ({
                    ...prev,
                    images: [...prev.images, ...compressedImages].slice(0, 9) // 再次確保不超過9張
                }));
            } catch (error) {
                showToast('圖片處理失敗，請換一張試試');
            }
            
            // 清空 input 值，讓重複選取同一檔案時也能觸發 onChange
            e.target.value = '';
          };

          const removeImage = (indexToRemove) => {
              setFormData(prev => ({
                  ...prev,
                  images: prev.images.filter((_, idx) => idx !== indexToRemove)
              }));
          };

          const autoBillingSum = useMemo(() => {
            let sum = 0;
            formData.personnel.forEach(p => { if (p.billable) sum += (Number(p.dailyRate) || 0); });
            formData.personnelExtras.forEach(pe => { if (pe.billable) sum += (Number(pe.amount) || 0); });
            formData.tasks.forEach(t => { if (t.billable) sum += Number(t.billingAmount) || 0; });
            formData.customItems.forEach(c => { if (c.billable) sum += (Number(c.qty) || 0) * (Number(c.price) || 0); });
            ['fuel', 'food', 'other'].forEach(key => {
              const c = formData.costs[key];
              if (c && c.billable) sum += Number(c.billingAmount) || 0;
            });
            return sum;
          }, [formData]);

          const totalBilling = formData.manualBilling !== '' && formData.manualBilling !== null && formData.manualBilling !== undefined ? Number(formData.manualBilling) : autoBillingSum;

          const summary = useMemo(() => {
            if (formData.type === 'holiday') return { totalCost: 0, totalBilling: 0, profit: 0 };
            const personnelCost = formData.personnel.reduce((sum, p) => sum + (Number(p.dailyRate) || 0), 0);
            const extrasCost = formData.personnelExtras.reduce((sum, pe) => sum + (Number(pe.amount) || 0), 0);
            const taskLaborCost = formData.tasks.reduce((sum, t) => sum + (Number(t.laborCost) || 0), 0);
            const taskMaterialCost = formData.tasks.reduce((sum, t) => sum + (Number(t.materialCost) || 0), 0);
            const customItemsCost = formData.customItems.reduce((sum, c) => sum + ((Number(c.qty) || 0) * (Number(c.price) || 0)), 0);
            const otherCosts = (Number(formData.costs?.fuel?.cost) || 0) + (Number(formData.costs?.food?.cost) || 0) + (Number(formData.costs?.other?.cost) || 0);
            
            const totalCost = personnelCost + extrasCost + taskLaborCost + taskMaterialCost + customItemsCost + otherCosts;
            return { totalCost, totalBilling, profit: totalBilling - totalCost };
          }, [formData, totalBilling]);

          const handleSubmit = (e) => {
            e.preventDefault();
            if (formData.type === 'holiday') {
              if (!formData.date) { alert('請填寫日期'); return; }
              const finalRecord = { ...formData, projectName: '休假', client: '無', summary: { totalCost: 0, totalBilling: 0, profit: 0 }, personnel: [], personnelExtras: [], tasks: [], customItems: [] };
              onSave(finalRecord);
              return;
            }

            if (!formData.projectName || !formData.date || !formData.client) {
              alert('請至少填寫工程名稱、日期與請款對象。');
              return;
            }
            const finalRecord = { ...formData, manualBilling: totalBilling, summary };
            onSave(finalRecord);
          };

          const isHoliday = formData.type === 'holiday';

          return (
            <div className="space-y-4 max-w-4xl mx-auto">
              {initialData && (
                <div className="bg-amber-50 border border-amber-200 text-amber-800 p-3 rounded-lg flex justify-between items-center text-xs">
                  <span>正在編輯：<strong>{initialData.projectName}</strong></span>
                  <button type="button" onClick={onCancelEdit} className="bg-amber-200 px-2.5 py-1 rounded font-semibold cursor-pointer">取消</button>
                </div>
              )}

              {!isHoliday && (
                <Card title="AI 智能摘要填寫" className="border-blue-100 bg-blue-50/25">
                  <div className="flex flex-col sm:flex-row gap-2.5">
                    <textarea
                      className="flex-1 w-full p-2.5 text-xs rounded-lg border border-blue-200 bg-white outline-none"
                      rows="2"
                      placeholder="貼上今日工作筆記..."
                      value={aiText}
                      onChange={(e) => setAiText(e.target.value)}
                    />
                    <button
                      type="button"
                      onClick={handleAIFill}
                      disabled={isAiLoading || !aiText.trim()}
                      className="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded-lg text-xs font-semibold cursor-pointer self-end sm:self-auto"
                    >
                      {isAiLoading ? '解析中...' : '一鍵填寫'}
                    </button>
                  </div>
                  {aiError && <p className="text-rose-600 mt-1.5 text-[11px]">{aiError}</p>}
                </Card>
              )}

              <form onSubmit={handleSubmit} className="space-y-4">
                <Card title="基本資訊">
                  <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-3">
                    <div className="col-span-full">
                      <label className="block text-[11px] font-bold text-slate-500 uppercase mb-1">紀錄分類</label>
                      <div className="flex flex-wrap gap-4 text-xs">
                        <label className="flex items-center gap-1.5 cursor-pointer font-medium">
                          <input type="radio" name="type" value="contract" checked={formData.type === 'contract'} onChange={(e) => handleInputChange('type', e.target.value)} className="w-3.5 h-3.5 text-blue-600" />
                          <span>發包</span>
                        </label>
                        <label className="flex items-center gap-1.5 cursor-pointer font-medium">
                          <input type="radio" name="type" value="hourly" checked={formData.type === 'hourly'} onChange={(e) => handleInputChange('type', e.target.value)} className="w-3.5 h-3.5 text-blue-600" />
                          <span>計工時</span>
                        </label>
                        <label className="flex items-center gap-1.5 cursor-pointer font-medium">
                          <input type="radio" name="type" value="quotation" checked={formData.type === 'quotation'} onChange={(e) => handleInputChange('type', e.target.value)} className="w-3.5 h-3.5 text-amber-600" />
                          <span className="font-bold text-amber-600">報價</span>
                        </label>
                        <label className="flex items-center gap-1.5 cursor-pointer font-medium">
                          <input type="radio" name="type" value="holiday" checked={formData.type === 'holiday'} onChange={(e) => handleInputChange('type', e.target.value)} className="w-3.5 h-3.5 text-rose-500" />
                          <span className="font-bold text-rose-500">⛱️ 休假</span>
                        </label>
                      </div>
                    </div>

                    <div>
                      <label className="block text-[11px] font-bold text-slate-500 uppercase mb-1">日期 *</label>
                      <input type="date" value={formData.date} onChange={(e) => handleInputChange('date', e.target.value)} className="w-full p-2 text-xs border border-slate-200 rounded-lg outline-none bg-white font-medium" required />
                    </div>

                    {!isHoliday && (
                      <>
                        <div>
                          <label className="block text-[11px] font-bold text-slate-500 uppercase mb-1">工程名稱 *</label>
                          <input type="text" value={formData.projectName} onChange={(e) => handleInputChange('projectName', e.target.value)} className="w-full p-2 text-xs border border-slate-200 rounded-lg outline-none bg-white font-medium" required={!isHoliday} placeholder="工程名稱" />
                        </div>
                        <div>
                          <label className="block text-[11px] font-bold text-slate-500 uppercase mb-1">請款對象 *</label>
                          <input type="text" value={formData.client} onChange={(e) => handleInputChange('client', e.target.value)} className="w-full p-2 text-xs border border-slate-200 rounded-lg outline-none bg-white font-medium" required={!isHoliday} placeholder="客戶" />
                        </div>
                        <div>
                          <label className="block text-[11px] font-bold text-slate-500 uppercase mb-1">地點</label>
                          <input type="text" value={formData.location} onChange={(e) => handleInputChange('location', e.target.value)} className="w-full p-2 text-xs border border-slate-200 rounded-lg outline-none bg-white font-medium" placeholder="地點" />
                        </div>
                        <div className="flex gap-2">
                          <div className="flex-1">
                            <label className="block text-[11px] font-bold text-slate-500 uppercase mb-1">開始時間</label>
                            <select value={formData.startTime} onChange={(e) => handleInputChange('startTime', e.target.value)} className="w-full p-2 text-xs border border-slate-200 rounded-lg bg-white outline-none font-mono">
                              {TIME_OPTIONS.map(time => <option key={time} value={time}>{time}</option>)}
                            </select>
                          </div>
                          <div className="flex-1">
                            <label className="block text-[11px] font-bold text-slate-500 uppercase mb-1">結束時間</label>
                            <select value={formData.endTime} onChange={(e) => handleInputChange('endTime', e.target.value)} className="w-full p-2 text-xs border border-slate-200 rounded-lg bg-white outline-none font-mono">
                              {TIME_OPTIONS.map(time => <option key={time} value={time}>{time}</option>)}
                            </select>
                          </div>
                        </div>
                      </>
                    )}
                  </div>
                </Card>

                {!isHoliday && (
                  <>
                    <Card title="參與人員">
                      <div className="mb-2.5 flex flex-wrap gap-1.5 items-center">
                        <span className="text-[11px] font-bold text-slate-400 mr-1">人員：</span>
                        {settings.fixedPersonnel.map(fp => {
                          const isAdded = formData.personnel.some(p => p.name === fp.name);
                          return (
                            <button type="button" key={fp.name} onClick={() => addFixedPersonnel(fp)} className={`px-2 py-1 rounded text-[11px] font-semibold border cursor-pointer ${isAdded ? 'bg-blue-50 border-blue-200 text-blue-700' : 'bg-slate-50 border-slate-200 hover:bg-slate-100 text-slate-700'}`}>
                              {isAdded ? '✓ ' : '+ '}{fp.name}
                            </button>
                          );
                        })}
                        <button type="button" onClick={() => addPersonnel(false, '')} className="px-2 py-1 rounded text-[11px] font-semibold border bg-emerald-50 border-emerald-200 text-emerald-700 cursor-pointer">+ 臨時工</button>
                      </div>

                      <div className="space-y-2 max-w-full overflow-hidden">
                        {formData.personnel.map(p => (
                          <div key={p.id} className="flex flex-nowrap items-center gap-1.5 bg-slate-50 p-2 rounded-lg border border-slate-200 overflow-x-auto hide-scrollbar w-full">
                            <label className="flex items-center gap-1 text-[11px] font-bold text-blue-700 cursor-pointer shrink-0">
                                <input type="checkbox" checked={p.billable === true} onChange={(e) => updatePersonnel(p.id, 'billable', e.target.checked)} className="w-3.5 h-3.5 text-blue-600 rounded cursor-pointer" />
                                <span>請款</span>
                            </label>
                            <input type="text" value={p.name} onChange={(e) => updatePersonnel(p.id, 'name', e.target.value)} className="w-20 shrink-0 p-1.5 border border-slate-200 rounded bg-white text-xs font-bold outline-none" placeholder="姓名" />
                            <select value={p.dayType || 'full'} onChange={(e) => updatePersonnel(p.id, 'dayType', e.target.value)} className="w-16 shrink-0 p-1.5 border border-slate-200 rounded bg-white text-[11px] font-semibold cursor-pointer outline-none text-center">
                                <option value="full">全日</option>
                                <option value="half">半日</option>
                            </select>
                            <div className="flex items-center gap-1 shrink-0 w-24">
                                <span className="text-[10px] text-slate-500 font-bold">日薪</span>
                                <input type="number" value={p.dailyRate || ''} onChange={(e) => updatePersonnel(p.id, 'dailyRate', e.target.value)} className="w-full p-1.5 border border-slate-200 rounded bg-white font-bold text-xs text-right outline-none" placeholder="0" />
                            </div>
                            <button type="button" onClick={() => removePersonnel(p.id)} className="text-rose-500 hover:bg-rose-100 p-1.5 rounded cursor-pointer shrink-0 ml-auto" title="刪除">
                                <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" /></svg>
                            </button>
                          </div>
                        ))}
                        {formData.personnel.length === 0 && <p className="text-[11px] text-slate-400 text-center py-3 bg-slate-50 rounded-lg border border-dashed border-slate-200 font-medium">尚未加入人員</p>}
                      </div>
                    </Card>

                    <Card title="其他人事費 (加班/獎金/補貼等)">
                      <div className="space-y-2 max-w-full overflow-hidden">
                        {formData.personnelExtras.map(pe => {
                           const isCustomType = !PERSONNEL_EXPENSE_OPTIONS.includes(pe.type) && pe.type !== '';
                           return (
                             <div key={pe.id} className="flex flex-nowrap items-center gap-1.5 bg-slate-50 p-2 rounded-lg border border-slate-200 overflow-x-auto hide-scrollbar w-full">
                               <label className="flex items-center gap-1 text-[11px] font-bold text-blue-700 cursor-pointer shrink-0">
                                   <input type="checkbox" checked={pe.billable === true} onChange={(e) => updatePersonnelExtra(pe.id, 'billable', e.target.checked)} className="w-3.5 h-3.5 text-blue-600 rounded cursor-pointer" />
                                   <span>請款</span>
                               </label>
                               
                               <select value={pe.name} onChange={(e) => updatePersonnelExtra(pe.id, 'name', e.target.value)} className="w-20 shrink-0 p-1.5 border border-slate-200 rounded bg-white text-xs font-bold outline-none">
                                  {formData.personnel.length === 0 && <option value="">請先新增人員</option>}
                                  {formData.personnel.map(p => <option key={p.id} value={p.name}>{p.name || '未具名'}</option>)}
                               </select>

                               {pe.type === '其他' || isCustomType ? (
                                   <div className="flex items-center relative w-24 shrink-0">
                                      <input type="text" value={pe.type === '其他' ? '' : pe.type} onChange={(e) => updatePersonnelExtra(pe.id, 'type', e.target.value)} className="w-full p-1.5 pr-6 border border-slate-200 rounded bg-white text-xs font-bold outline-none" placeholder="自訂項目" autoFocus />
                                      <button type="button" onClick={() => updatePersonnelExtra(pe.id, 'type', '加班費')} className="absolute right-1 text-slate-400 hover:text-slate-600 text-xs p-1">✕</button>
                                   </div>
                               ) : (
                                   <select value={pe.type} onChange={(e) => updatePersonnelExtra(pe.id, 'type', e.target.value)} className="w-24 shrink-0 p-1.5 border border-slate-200 rounded bg-white text-[11px] font-semibold cursor-pointer outline-none">
                                      {PERSONNEL_EXPENSE_OPTIONS.map(opt => <option key={opt} value={opt}>{opt}</option>)}
                                   </select>
                               )}

                               <div className="flex items-center gap-1 shrink-0 w-24">
                                   <span className="text-[10px] text-slate-500 font-bold">金額</span>
                                   <input type="number" value={pe.amount || ''} onChange={(e) => updatePersonnelExtra(pe.id, 'amount', e.target.value)} className="w-full p-1.5 border border-slate-200 rounded bg-amber-50 font-bold text-xs text-right outline-none text-amber-700" placeholder="0" />
                               </div>
                               <button type="button" onClick={() => removePersonnelExtra(pe.id)} className="text-rose-500 hover:bg-rose-100 p-1.5 rounded cursor-pointer shrink-0 ml-auto" title="刪除">
                                   <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" /></svg>
                               </button>
                             </div>
                           );
                        })}
                        {formData.personnelExtras.length === 0 && <p className="text-[11px] text-slate-400 text-center py-3 bg-slate-50 rounded-lg border border-dashed border-slate-200 font-medium">尚無其他人事費</p>}
                      </div>
                      <button type="button" onClick={addPersonnelExtra} disabled={formData.personnel.length === 0} className="mt-2 text-[11px] font-bold text-amber-600 bg-amber-50 hover:bg-amber-100 px-3 py-1.5 rounded cursor-pointer disabled:opacity-50 disabled:cursor-not-allowed">+ 新增項目</button>

        function BillingView({ records, settings, onUpdateRecord, setOfficialInvoiceModal, showToast }) {
          const [selectedMonth, setSelectedMonth] = useState(new Date().toISOString().slice(0, 7));
          const [selectedClient, setSelectedClient] = useState('全部');
          const [expandedProjects, setExpandedProjects] = useState({});

          const validRecords = useMemo(() => records.filter(r => r.type !== 'quotation' && r.type !== 'holiday'), [records]);
          
          const clients = useMemo(() => {
            const list = Array.from(new Set(validRecords.filter(r => r.date && r.date.startsWith(selectedMonth)).map(r => r.client)));
            return ['全部', ...list];
          }, [validRecords, selectedMonth]);

          useEffect(() => { 
            if (!clients.includes(selectedClient)) setSelectedClient('全部'); 
          }, [clients, selectedClient]);

          const clientRecords = useMemo(() => {
            return validRecords.filter(r => {
              if (!r.date || !r.date.startsWith(selectedMonth)) return false;
              if (selectedClient === '全部') return true;
              return r.client === selectedClient;
            });
          }, [validRecords, selectedMonth, selectedClient]);
          
          const groupedByProject = useMemo(() => {
            const map = {};
            clientRecords.forEach(r => {
              const pName = r.projectName || '未命名工程';
              const clientKey = selectedClient === '全部' ? `[${r.client || '散客'}] ${pName}` : pName;
              
              if (!map[clientKey]) {
                map[clientKey] = {
                  projectName: pName,
                  client: r.client || '散客',
                  records: [],
                  totalLabor: 0,
                  totalMaterial: 0,
                  totalExpenses: 0,
                  grandTotalBilling: 0,
                  isCollected: r.isCollected
                };
              }
              map[clientKey].records.push(r);
              
              let labor = 0;
              (r.personnel || []).forEach(p => { labor += (Number(p.dailyRate) || 0); });
              (r.personnelExtras || []).forEach(pe => { labor += (Number(pe.amount) || 0); });
              (r.tasks || []).forEach(t => { labor += Number(t.laborCost) || 0; });
              map[clientKey].totalLabor += labor;

              let material = 0;
              (r.tasks || []).forEach(t => { material += Number(t.materialCost) || 0; });
              (r.customItems || []).forEach(c => { material += (Number(c.qty) || 0) * (Number(c.price) || 0); });
              map[clientKey].totalMaterial += material;

              let exp = 0;
              ['fuel', 'food', 'other'].forEach(k => {
                exp += Number(r.costs?.[k]?.cost) || 0;
              });
              map[clientKey].totalExpenses += exp;

              map[clientKey].grandTotalBilling += r.summary?.totalBilling || 0;
            });
            return Object.values(map);
          }, [clientRecords, selectedClient]);

          const overallGrandTotal = groupedByProject.reduce((sum, item) => sum + item.grandTotalBilling, 0);

          const toggleExpand = (key) => {
            setExpandedProjects(prev => ({ ...prev, [key]: !prev[key] }));
          };

          const toggleProjectCollected = (proj, e) => {
            e.stopPropagation();
            const nextStatus = !proj.isCollected;
            proj.records.forEach(r => {
              const updated = { ...r, isCollected: nextStatus, collectionDate: nextStatus ? new Date().toISOString().slice(0, 10) : '' };
              onUpdateRecord(updated);
            });
          };

          return (
            <div className="space-y-4 max-w-4xl mx-auto">
              <div className="bg-white px-3 py-2 rounded-xl border border-slate-200 shadow-2xs flex items-center justify-between gap-2 print:hidden">
                <div className="flex items-center gap-2 text-xs">

                    <span className="font-bold text-slate-500">月份:</span>
                    <input type="month" value={selectedMonth} onChange={e => setSelectedMonth(e.target.value)} className="p-1 border border-slate-200 rounded font-bold bg-slate-50 text-xs" />
                  </div>
                  <div className="flex items-center gap-1">
                    <span className="font-bold text-slate-500">對象:</span>
                    <select value={selectedClient} onChange={e => setSelectedClient(e.target.value)} className="p-1 border border-slate-200 rounded font-bold bg-slate-50 text-xs max-w-[100px]">
                      {clients.map(c => <option key={c} value={c}>{c}</option>)}
                    </select>
                  </div>
                </div>
              </div>

              {groupedByProject.length > 0 && (
                <div className="bg-white p-3 sm:p-6 rounded-xl border border-slate-200 shadow-xs space-y-4">
                  <div className="text-center pb-4 border-b-2 border-slate-800">
                    <h2 className="text-xl sm:text-2xl font-extrabold text-slate-900 mb-1">{settings.companyName || '工程請款單'}</h2>
                    {settings.taxId && <p className="text-[11px] text-slate-500 font-medium">統編：{settings.taxId} | 電話：{settings.phone}</p>}
                    <div className="flex justify-between items-center text-xs font-bold text-slate-700 mt-3 px-1">
                      <span>客戶：{selectedClient}</span>
                      <span>月份：{selectedMonth}</span>
                    </div>
                  </div>

                  <div className="space-y-3">
                    <h3 className="text-[11px] font-bold text-slate-400 uppercase tracking-wider print:hidden">請款專案一覽表 (點擊展開詳細明細)</h3>
                    
                    {groupedByProject.map((proj, pIdx) => {
                      const isExpanded = expandedProjects[pIdx];
                      return (
                        <div key={pIdx} className="border border-slate-200 rounded-xl overflow-hidden bg-slate-50/40 transition-all">
                          <div 
                            onClick={() => toggleExpand(pIdx)}
                            className="p-3 flex justify-between items-center gap-2 bg-white cursor-pointer active:bg-slate-50 md:hover:bg-slate-50 select-none min-h-[58px]"
                          >
                            <div className="flex items-center gap-2.5 min-w-0 flex-1">
                              <span className={`w-6 h-6 shrink-0 rounded-lg flex items-center justify-center font-bold text-[11px] ${isExpanded ? 'bg-blue-600 text-white' : 'bg-slate-100 text-slate-600'} print:hidden`}>
                                {isExpanded ? '▲' : '▼'}
                              </span>
                              <div className="min-w-0 flex-1 truncate">
                                <h4 className="font-bold text-xs sm:text-sm text-slate-900 truncate">{proj.projectName}</h4>
                                <p className="text-[10px] text-slate-500 font-medium truncate">客戶：{proj.client}</p>
                              </div>
                            </div>

                            <div className="flex items-center gap-2 shrink-0">
                              <div onClick={(e) => e.stopPropagation()} className="w-[65px] text-center print:hidden">
                                <label className={`inline-flex items-center justify-center w-full px-1.5 py-1 rounded text-[10px] font-bold cursor-pointer ${proj.isCollected ? 'bg-emerald-100 text-emerald-800' : 'bg-amber-100 text-amber-800'}`}>
                                  <input 
                                    type="checkbox" 
                                    checked={proj.isCollected} 
                                    onChange={(e) => toggleProjectCollected(proj, e)} 
                                    className="w-3 h-3 text-emerald-600 rounded cursor-pointer mr-1 shrink-0" 
                                  />
                                  <span className="truncate">{proj.isCollected ? '已收款' : '未收'}</span>
                                </label>
                              </div>

                              <div className="text-right w-[75px] sm:w-[90px]">
                                <span className="text-[9px] text-slate-400 block font-bold">小計</span>
                                <span className="text-sm sm:text-base font-extrabold text-blue-600">${proj.grandTotalBilling.toLocaleString()}</span>
                              </div>
                            </div>
                          </div>

                          <div className={`${isExpanded ? 'block' : 'hidden'} print:block p-3 bg-white border-t border-slate-100 space-y-3`}>

                            {(() => {

                  <div className="text-right border-t-2 border-slate-800 pt-3 mt-4 flex justify-between items-center gap-2">
                    <button 
                      onClick={() => {
                        const uncollectedRecords = clientRecords.filter(r => {
                            const pName = r.projectName || '未命名工程';
                            const clientKey = selectedClient === '全部' ? `[${r.client || '散客'}] ${pName}` : pName;
                            const projectGroup = groupedByProject.find(g => 
                                (selectedClient === '全部' ? `[${g.client}] ${g.projectName}` : g.projectName) === clientKey

                        let finalTotalMaterial = 0;
                        let finalTotalExpenses = 0;
                        let finalGrandTotal = 0;

                        uncollectedRecords.forEach(r => {
                             let l = 0;
                             (r.personnel || []).forEach(p => { l += (Number(p.dailyRate)||0); });
                             (r.personnelExtras || []).forEach(pe => { l += (Number(pe.amount)||0); });
                             (r.tasks || []).forEach(t => { l += Number(t.laborCost)||0; });
                             finalTotalLabor += l;

                             let m = 0;
                             (r.tasks || []).forEach(t => { m += Number(t.materialCost)||0; });
                             (r.customItems || []).forEach(c => { m += (Number(c.qty)||0)*(Number(c.price)||0); });
                             finalTotalMaterial += m;

                             let e = 0;
                             ['fuel', 'food', 'other'].forEach(k => { e += Number(r.costs?.[k]?.cost) || 0; });
                             finalTotalExpenses += e;

                             finalGrandTotal += (r.summary?.totalBilling || 0);

        function SalaryView({ records, settings, setOfficialSalaryModal, showToast }) {
          const [selectedMonth, setSelectedMonth] = useState(new Date().toISOString().slice(0, 7));
          const [selectedEmployee, setSelectedEmployee] = useState('全部');
          const [expandedEmployees, setExpandedEmployees] = useState({});

          const toggleExpand = (name) => {
             setExpandedEmployees(prev => ({ ...prev, [name]: !prev[name] }));
          };

          const allEmployeeNames = useMemo(() => {
            const setNames = new Set();
            records.forEach(r => {
              if (r.type !== 'quotation' && r.type !== 'holiday' && r.date && r.date.startsWith(selectedMonth)) {
                (r.personnel || []).forEach(p => { if (p.name) setNames.add(p.name); });
              }
            });
            return ['全部', ...Array.from(setNames)];
          }, [records, selectedMonth]);

          useEffect(() => {
            if (!allEmployeeNames.includes(selectedEmployee)) setSelectedEmployee('全部');
          }, [allEmployeeNames, selectedEmployee]);

          const salaryData = useMemo(() => {
            const monthRecords = records.filter(r => r.type !== 'quotation' && r.type !== 'holiday' && r.date && r.date.startsWith(selectedMonth));
            const employeeMap = {};

            monthRecords.forEach(r => {
              (r.personnel || []).forEach(p => {
                const name = p.name || '未具名';
                if (selectedEmployee !== '全部' && name !== selectedEmployee) return;

                if (!employeeMap[name]) {
                  employeeMap[name] = {
                    name, month: selectedMonth, totalDays: 0, totalSalary: 0, baseSalary: 0, overtimeTotal: 0, bonusTotal: 0, otherTotal: 0,
                    workDetails: [], otBonusDetails: [], otherDetails: []
                  };
                }
                const dayValue = p.dayType === 'half' ? 0.5 : 1.0;
                const dailyPay = Number(p.dailyRate) || 0;

                employeeMap[name].totalDays += dayValue;
                employeeMap[name].baseSalary += dailyPay;
                employeeMap[name].totalSalary += dailyPay;
                employeeMap[name].workDetails.push({
                  date: r.date, projectName: r.projectName, dayType: p.dayType === 'half' ? '半日' : '全日', dailyRate: dailyPay
                });
              });

              (r.personnelExtras || []).forEach(pe => {
                 const name = pe.name || '未具名';
                 if (selectedEmployee !== '全部' && name !== selectedEmployee) return;
                 if (!employeeMap[name]) {
                    employeeMap[name] = {
                      name, month: selectedMonth, totalDays: 0, totalSalary: 0, baseSalary: 0, overtimeTotal: 0, bonusTotal: 0, otherTotal: 0,
                      workDetails: [], otBonusDetails: [], otherDetails: []
                    };
                 }

                 const amount = Number(pe.amount) || 0;
                 employeeMap[name].totalSalary += amount;

                 if (pe.type === '加班費' || pe.type === '獎金' || pe.type === '加班' || pe.type === '獎金(舊)') {
                     if (pe.type.includes('加班')) employeeMap[name].overtimeTotal += amount;
                     if (pe.type.includes('獎金')) employeeMap[name].bonusTotal += amount;
                     employeeMap[name].otBonusDetails.push({ date: r.date, projectName: r.projectName, type: pe.type, amount });
                 } else {
                     employeeMap[name].otherTotal += amount;
                     employeeMap[name].otherDetails.push({ date: r.date, projectName: r.projectName, type: pe.type, amount });
                 }
              });
            });

            const orderMap = {};
            settings.fixedPersonnel.forEach((fp, idx) => { orderMap[fp.name] = idx; });

            const unsortedData = Object.values(employeeMap);
            return unsortedData.sort((a, b) => {
              const idxA = orderMap[a.name] !== undefined ? orderMap[a.name] : 999;
              const idxB = orderMap[b.name] !== undefined ? orderMap[b.name] : 999;
              return idxA - idxB;
            });
          }, [records, selectedMonth, selectedEmployee, settings.fixedPersonnel]);

          return (
            <div className="space-y-4 max-w-4xl mx-auto">
              <div className="bg-white px-3 py-2 rounded-xl border border-slate-200 shadow-2xs flex items-center justify-between gap-2">
                <div className="flex items-center gap-2 text-xs w-full">
                  <div className="flex items-center gap-1">
                    <span className="font-bold text-slate-500">月份:</span>
                    <input type="month" value={selectedMonth} onChange={e => setSelectedMonth(e.target.value)} className="p-1 border border-slate-200 rounded font-bold bg-slate-50 text-xs" />
                  </div>
                  <div className="flex items-center gap-1">
                    <span className="font-bold text-slate-500">員工:</span>
                    <select value={selectedEmployee} onChange={e => setSelectedEmployee(e.target.value)} className="p-1 border border-slate-200 rounded font-bold bg-slate-50 text-xs max-w-[90px]">
                      {allEmployeeNames.map(name => <option key={name} value={name}>{name}</option>)}
                    </select>
                  </div>
                  <div className="ml-auto">
                    <button 
                       onClick={() => {
                          if(salaryData.length === 0) {
                              showToast('本月無薪資資料可產出');
                              return;
                          }
                          setOfficialSalaryModal(salaryData);
                       }}
                       className="bg-emerald-600 hover:bg-emerald-700 text-white px-3 py-1.5 rounded-lg text-xs font-bold cursor-pointer inline-flex items-center gap-1 shadow-sm whitespace-nowrap"
                    >
                      <span>📄 產生全員薪資單</span>
                    </button>
                  </div>
                </div>
              </div>

              <div className="space-y-2.5">
                {salaryData.map(emp => {
                  const isExpanded = expandedEmployees[emp.name];
                  return (
                    <Card key={emp.name} className="p-0 border border-emerald-200/60" onClick={() => toggleExpand(emp.name)}>
                      
                      {/* 個人摘要 (點擊展開) - 調整為極致緊湊 */}

                        <div className="flex justify-between items-center mb-1.5">

                             <span className={`w-4 h-4 rounded-sm flex items-center justify-center font-bold text-[9px] ${isExpanded ? 'bg-emerald-600 text-white' : 'bg-slate-100 text-slate-500'}`}>
                                {isExpanded ? '▲' : '▼'}
                             </span>
                             <h3 className="font-bold text-sm text-slate-900">{emp.name}</h3>
                          </div>
                          <div className="flex items-center gap-1.5">
                             <span className="text-[10px] text-slate-400 font-bold">總計</span>
                             <span className="text-base font-black text-emerald-600 leading-none">${emp.totalSalary.toLocaleString()}</span>
                          </div>
                        </div>

                        <div className="grid grid-cols-5 gap-1 text-center bg-slate-50 p-1.5 rounded-lg border border-slate-100">
                           <div><span className="block text-[9px] text-slate-400 font-bold mb-0.5">天數</span><span className="font-bold text-slate-700 text-[10px]">{emp.totalDays}</span></div>
                           <div><span className="block text-[9px] text-slate-400 font-bold mb-0.5">工資</span><span className="font-bold text-slate-700 text-[10px]">${emp.baseSalary.toLocaleString()}</span></div>
                           <div><span className="block text-[9px] text-slate-400 font-bold mb-0.5">加班</span><span className="font-bold text-slate-700 text-[10px]">${emp.overtimeTotal.toLocaleString()}</span></div>
                           <div><span className="block text-[9px] text-slate-400 font-bold mb-0.5">獎金</span><span className="font-bold text-slate-700 text-[10px]">${emp.bonusTotal.toLocaleString()}</span></div>
                           <div><span className="block text-[9px] text-slate-400 font-bold mb-0.5">其他</span><span className="font-bold text-slate-700 text-[10px]">${emp.otherTotal.toLocaleString()}</span></div>
                        </div>
                      </div>

                      {isExpanded && (
                        <div className="p-2 bg-slate-50 border-t border-slate-200 space-y-2" onClick={e => e.stopPropagation()}>
                          <div className="bg-white rounded-md border border-slate-200 p-1.5">
                            <h4 className="font-bold text-[9px] text-slate-500 mb-1 ml-1">出勤明細</h4>
                            <div className="overflow-x-auto hide-scrollbar">
                              <table className="w-full min-w-full text-left border-collapse text-[10px]">
                                <thead>
                                  <tr className="bg-slate-50 text-slate-500 font-bold border-b border-slate-100 whitespace-nowrap">
                                    <th className="px-1.5 py-0.5 w-[20%]">日期</th>
                                    <th className="px-1.5 py-0.5 w-[50%]">工程名稱</th>
                                    <th className="px-1.5 py-0.5 text-center w-[15%]">班別</th>
                                    <th className="px-1.5 py-0.5 text-right w-[15%]">工資</th>
                                  </tr>
                                </thead>
                                <tbody className="divide-y divide-slate-50">
                                  {emp.workDetails.map((d, idx) => (
                                    <tr key={idx} className="whitespace-nowrap">
                                      <td className="px-1.5 py-1 font-mono text-slate-400 text-[9px]">{d.date.slice(5)}</td>
                                      <td className="px-1.5 py-1 font-bold text-slate-700">{d.projectName}</td>
                                      <td className="px-1.5 py-1 text-center text-slate-600">{d.dayType}</td>
                                      <td className="px-1.5 py-1 text-right font-bold text-slate-800">${d.dailyRate.toLocaleString()}</td>
                                    </tr>
                                  ))}
                                  {emp.workDetails.length === 0 && <tr><td colSpan="4" className="text-center py-1.5 text-slate-400">無出勤紀錄</td></tr>}
                                </tbody>
                              </table>
                            </div>
                          </div>

                          {emp.otBonusDetails.length > 0 && (
                            <div className="bg-white rounded-md border border-slate-200 p-1.5">
                              <h4 className="font-bold text-[9px] text-slate-500 mb-1 ml-1">加班與獎金</h4>
                              <div className="overflow-x-auto hide-scrollbar">
                                <table className="w-full min-w-full text-left border-collapse text-[10px]">
                                  <thead>
                                    <tr className="bg-slate-50 text-slate-500 font-bold border-b border-slate-100 whitespace-nowrap">
                                      <th className="px-1.5 py-0.5 w-[20%]">日期</th>
                                      <th className="px-1.5 py-0.5 w-[50%]">工程名稱</th>
                                      <th className="px-1.5 py-0.5 text-center w-[15%]">類別</th>
                                      <th className="px-1.5 py-0.5 text-right w-[15%]">金額</th>
                                    </tr>
                                  </thead>
                                  <tbody className="divide-y divide-slate-50">
                                    {emp.otBonusDetails.map((d, idx) => (
                                      <tr key={idx} className="whitespace-nowrap">
                                        <td className="px-1.5 py-1 font-mono text-slate-400 text-[9px]">{d.date.slice(5)}</td>
                                        <td className="px-1.5 py-1 font-bold text-slate-700">{d.projectName}</td>
                                        <td className="px-1.5 py-1 text-center text-blue-600 font-bold">{d.type}</td>
                                        <td className="px-1.5 py-1 text-right font-bold text-slate-800">${d.amount.toLocaleString()}</td>
                                      </tr>
                                    ))}
                                  </tbody>
                                </table>
                              </div>
                            </div>
                          )}

                          {emp.otherDetails.length > 0 && (
                            <div className="bg-white rounded-md border border-slate-200 p-1.5">
                              <h4 className="font-bold text-[9px] text-slate-500 mb-1 ml-1">其他額外項目</h4>
                              <div className="overflow-x-auto hide-scrollbar">
                                <table className="w-full min-w-full text-left border-collapse text-[10px]">
                                  <thead>
                                    <tr className="bg-slate-50 text-slate-500 font-bold border-b border-slate-100 whitespace-nowrap">
                                      <th className="px-1.5 py-0.5 w-[20%]">日期</th>
                                      <th className="px-1.5 py-0.5 w-[50%]">工程名稱</th>
                                      <th className="px-1.5 py-0.5 text-center w-[15%]">項目</th>

                                    {emp.otherDetails.map((d, idx) => (
                                      <tr key={idx} className="whitespace-nowrap">
                                        <td className="px-1.5 py-1 font-mono text-slate-400 text-[9px]">{d.date.slice(5)}</td>
                                        <td className="px-1.5 py-1 font-bold text-slate-700">{d.projectName}</td>
                                        <td className="px-1.5 py-1 text-center text-amber-600 font-bold">{d.type}</td>
                                        <td className="px-1.5 py-1 text-right font-bold text-slate-800">${d.amount.toLocaleString()}</td>

                          <div className="text-right pt-1.5 mt-1 border-t border-slate-200/60">

                             </button>
                          </div>

                {salaryData.length === 0 && (

                          <span className="text-[10px] text-slate-400 block font-bold">報價總額</span>
                          <span className="text-base font-black text-amber-600">${(r.summary?.totalBilling || 0).toLocaleString()}</span>
                        </div>
                        <div className="flex gap-1.5 items-center">
