                          <button onClick={() => onEdit(r)} className="px-3 py-1.5 bg-blue-50 text-blue-600 hover:bg-blue-100 rounded-lg text-xs font-semibold cursor-pointer whitespace-nowrap">編輯</button>
                          <button onClick={() => onDelete(r.id)} className="px-3 py-1.5 bg-rose-50 text-rose-600 hover:bg-rose-100 rounded-lg text-xs font-semibold cursor-pointer whitespace-nowrap">刪除</button>
                        </div>
                      </div>
                    </div>

                    <div className="space-y-2">
                      <h4 className="text-[10px] font-bold text-slate-500 uppercase">報價項目明細</h4>
                      <div className="border border-slate-200/80 rounded-lg overflow-x-auto hide-scrollbar">
                        <table className="w-full min-w-full text-left border-collapse text-[10px] bg-slate-50/60">
                          <thead>
                            <tr className="bg-slate-100 text-slate-600 border-b border-slate-200 font-bold whitespace-nowrap">
                              <th className="px-2 py-1.5 w-[40%]">項目描述</th>
                              <th className="px-2 py-1.5 text-right w-[20%]">工費</th>
                              <th className="px-2 py-1.5 text-right w-[20%]">料費</th>
                              <th className="px-2 py-1.5 text-right w-[20%]">金額</th>
                            </tr>
                          </thead>
                          <tbody className="divide-y divide-slate-100">
                            {(r.tasks || []).map((t, tIdx) => (
                              <tr key={tIdx} className="hover:bg-slate-50 whitespace-nowrap">
                                <td className="px-2 py-1.5 font-semibold text-slate-800">{t.description}</td>
                                <td className="px-2 py-1.5 text-right text-slate-600">${(Number(t.laborCost)||0).toLocaleString()}</td>
                                <td className="px-2 py-1.5 text-right text-slate-600">${(Number(t.materialCost)||0).toLocaleString()}</td>
                                <td className="px-2 py-1.5 text-right font-bold text-slate-900">${(Number(t.billingAmount)||0).toLocaleString()}</td>
                              </tr>
                            ))}
                          </tbody>
                        </table>
                      </div>
                      
                      {r.customItems && r.customItems.length > 0 && (
                        <div className="mt-3">
                          <h4 className="text-[10px] font-bold text-slate-500 uppercase mb-1">材料購買明細</h4>
                          <div className="border border-slate-200/80 rounded-lg overflow-x-auto hide-scrollbar">
                            <table className="w-full min-w-full text-left border-collapse text-[10px] bg-slate-50/60">
                              <thead>
                                <tr className="bg-slate-100 text-slate-600 font-bold border-b border-slate-200 whitespace-nowrap">
                                  <th className="px-2 py-1.5 w-[25%]">日期</th>
                                  <th className="px-2 py-1.5 w-[55%]">材料名稱</th>
                                  <th className="px-2 py-1.5 text-right w-[20%]">價格</th>
                                </tr>
                              </thead>
                              <tbody className="divide-y divide-slate-100">
                                {r.customItems.map((c, cIdx) => (
                                  <tr key={cIdx} className="hover:bg-slate-50 whitespace-nowrap">
                                    <td className="px-2 py-1.5 font-mono text-slate-500">{r.date}</td>
                                    <td className="px-2 py-1.5 font-semibold text-slate-800">{c.name}</td>
                                    <td className="px-2 py-1.5 text-right font-bold text-slate-900">${((Number(c.qty)||0)*(Number(c.price)||0)).toLocaleString()}</td>
                                  </tr>
                                ))}
                              </tbody>
                            </table>
                          </div>
                        </div>
                      )}
                      
                      {r.remarks && <p className="text-[11px] text-slate-500 font-medium mt-2">備註：{r.remarks}</p>}
                    </div>
                  </div>
                ))}
                {quotationRecords.length === 0 && <p className="text-center text-xs text-slate-400 py-8 bg-white rounded-xl border border-slate-200 font-medium">尚無任何報價紀錄</p>}
              </div>
            </div>
          );
        }

        function MonthlyReportView({ records, onDelete, onEdit, setZoomedImage }) {
          const [selectedMonth, setSelectedMonth] = useState(new Date().toISOString().slice(0, 7));
          const [filterType, setFilterType] = useState('all');
          const [expandedRecordIds, setExpandedRecordIds] = useState({});
          // 新增：獨立控制照片區塊（第三層）展開的狀態
          const [expandedPhotoIds, setExpandedPhotoIds] = useState({}); 
          const [selectedCalendarDate, setSelectedCalendarDate] = useState(null); 
          
          useEffect(() => {
              setSelectedCalendarDate(null);
          }, [selectedMonth]);

          const [yearStr, monthStr] = selectedMonth.split('-');
          const year = parseInt(yearStr);
          const month = parseInt(monthStr);
          const firstDayIndex = new Date(year, month - 1, 1).getDay();
          const daysInMonth = new Date(year, month, 0).getDate();

          const monthlyRecords = useMemo(() => {
            return records.filter(r => r.type !== 'quotation' && r.date && r.date.startsWith(selectedMonth));
          }, [records, selectedMonth]);

          const projectNames = ['全部', ...new Set(monthlyRecords.filter(r => r.type !== 'holiday').map(r => r.projectName))];

          const filteredRecords = useMemo(() => {
            return monthlyRecords.filter(r => {
              if (filterType !== 'all' && filterType !== r.projectName) return false;
              return true;
            });
          }, [monthlyRecords, filterType]);

          const summary = useMemo(() => {
            const workRecords = filteredRecords.filter(r => r.type !== 'holiday');
            return workRecords.reduce((acc, curr) => ({
              cost: acc.cost + (curr.summary?.totalCost || 0),
              billing: acc.billing + (curr.summary?.totalBilling || 0),
              profit: acc.profit + (curr.summary?.profit || 0)
            }), { cost: 0, billing: 0, profit: 0 });
          }, [filteredRecords]);

          const workDaysCount = new Set(filteredRecords.filter(r => r.type !== 'holiday').map(r => r.date)).size;
          const projectCount = new Set(filteredRecords.filter(r => r.type !== 'holiday' && r.projectName).map(r => r.projectName)).size;

          const activeDates = new Set(filteredRecords.filter(r => r.type !== 'holiday').map(r => r.date));
          const holidayDates = new Set(filteredRecords.filter(r => r.type === 'holiday').map(r => r.date));

          const displayList = useMemo(() => {
             if (selectedCalendarDate) {
                 return filteredRecords.filter(r => r.date === selectedCalendarDate);
             }
             return filteredRecords;
          }, [filteredRecords, selectedCalendarDate]);

          const toggleRecordExpand = (id) => {
            setExpandedRecordIds(prev => ({ ...prev, [id]: !prev[id] }));
          };

          // 新增：切換特定紀錄照片區塊（第三層）的函數
          const togglePhotoExpand = (id) => {
            setExpandedPhotoIds(prev => ({ ...prev, [id]: !prev[id] }));
          };

          return (
            <div className="space-y-4 max-w-4xl mx-auto">
              
              <div className="flex justify-between items-center bg-white px-3 py-2 rounded-xl border border-slate-200 shadow-2xs gap-3">
                <input type="month" value={selectedMonth} onChange={(e) => setSelectedMonth(e.target.value)} className="text-xs font-bold outline-none border-b border-slate-300 pb-0.5 bg-transparent" />
                <select value={filterType} onChange={(e) => setFilterType(e.target.value)} className="bg-slate-100 p-1.5 rounded-lg text-[11px] font-bold text-slate-700 outline-none max-w-[150px] truncate">
                  {projectNames.map(name => (
                    <option key={name} value={name}>{name === 'all' ? '全部工程' : name}</option>
                  ))}
                </select>
              </div>

              <div className="flex gap-2 mb-4">
                <div className="flex-1 bg-white rounded-xl shadow-sm p-3 border border-slate-100 flex flex-col justify-between overflow-hidden min-w-[135px]">
                    <h3 className="font-bold text-slate-600 text-xs mb-2 border-b border-slate-100 pb-1.5 shrink-0 whitespace-nowrap">月份摘要</h3>
                    <div className="space-y-3 mt-1 flex-1 flex flex-col justify-around">
                        <div className="whitespace-nowrap overflow-x-auto hide-scrollbar">
                            <p className="text-slate-400 text-[11px] mb-0.5">總成本 / 總請款</p>
                            <p className="font-bold text-slate-700 text-[15px] sm:text-base">${summary.cost.toLocaleString()} / <span className="text-blue-600">${summary.billing.toLocaleString()}</span></p>
                        </div>
                        <div className="whitespace-nowrap overflow-x-auto hide-scrollbar">
                            <p className="text-slate-400 text-[11px] mb-0.5">總利潤</p>
                            <p className="font-bold text-emerald-600 text-[18px] sm:text-xl">${summary.profit.toLocaleString()}</p>
                        </div>
                        <div className="flex justify-between items-center gap-2 pt-2 border-t border-slate-100 mt-1 whitespace-nowrap">
                            <div>
                                <p className="text-slate-400 text-[11px]">工程數</p>
                                <p className="font-bold text-slate-700 text-sm sm:text-[15px]">{projectCount}</p>
                            </div>
                            <div>
                                <p className="text-slate-400 text-[11px]">工作天</p>
                                <p className="font-bold text-slate-700 text-sm sm:text-[15px]">{workDaysCount}</p>
                            </div>
                        </div>
                    </div>
                </div>

                <div className="flex-[1.2] bg-white rounded-xl shadow-sm p-2 border border-slate-100 flex flex-col justify-between">
                    <div className="flex justify-between items-center mb-1 pb-1 border-b border-slate-50">
                        <h3 className="font-bold text-slate-500 text-[11px] whitespace-nowrap">當月月曆</h3>
                        {selectedCalendarDate && <button onClick={() => setSelectedCalendarDate(null)} className="text-[10px] text-blue-600 font-bold hover:underline whitespace-nowrap">顯示整月</button>}
                    </div>
                    <div>
                        <div className="grid grid-cols-7 gap-0.5 text-center text-[10px] font-bold text-slate-400 mb-1">
                            <span>日</span><span>一</span><span>二</span><span>三</span><span>四</span><span>五</span><span>六</span>
                        </div>
                        <div className="grid grid-cols-7 gap-0.5 text-center text-xs">
                            {Array.from({ length: firstDayIndex }).map((_, i) => <div key={`empty-${i}`} />)}
                            
                            {Array.from({ length: daysInMonth }).map((_, i) => {
                                const day = i + 1;
                                const dateStr = `${year}-${String(month).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
                                const isWorkDay = activeDates.has(dateStr);
                                const isHoliday = holidayDates.has(dateStr);
                                const isSelected = selectedCalendarDate === dateStr;
                                
                                // 全新配色邏輯 (修正手機版 hover 雙擊問題)
                                let styleClass = "text-slate-500 active:bg-slate-100 md:hover:bg-slate-50"; 
                                
                                if (isSelected) {
                                    if (isWorkDay) {
                                        styleClass = "bg-sky-100 text-sky-700 font-bold ring-1 ring-sky-200 shadow-sm"; 
                                    } else if (isHoliday) {
                                        styleClass = "bg-amber-100 text-amber-700 font-bold ring-1 ring-amber-200 shadow-sm"; 
                                    } else {
                                        styleClass = "bg-slate-200 text-slate-700 font-bold ring-1 ring-slate-300 shadow-sm"; 
                                    }
                                } else {
                                    if (isWorkDay) {
                                        styleClass = "text-sky-500 font-bold active:bg-sky-100 md:hover:bg-sky-50"; 
                                    } else if (isHoliday) {
                                        styleClass = "text-amber-500 font-bold active:bg-amber-100 md:hover:bg-amber-50"; 
                                    }
                                }

                                return (
                                    <div key={dateStr}
                                          onClick={() => setSelectedCalendarDate(dateStr === selectedCalendarDate ? null : dateStr)}
                                          className={`aspect-square flex items-center justify-center rounded-lg cursor-pointer transition ${styleClass}`}>
                                        {day}
                                    </div>
                                );
                            })}
                        </div>
                    </div>
                </div>
              </div>

              <Card title={selectedCalendarDate ? `📌 ${selectedCalendarDate} 紀錄明細` : '📋 本月所有紀錄明細 (點擊可展開)'}>
                <div className="space-y-3">
                  {displayList.map(r => {
                    const isExpanded = expandedRecordIds[r.id];
                    const isHoliday = r.type === 'holiday';
                    return (
                      <div key={r.id} className={`border border-slate-200 rounded-xl bg-white shadow-2xs overflow-hidden transition-all ${isHoliday ? 'border-l-4 border-l-amber-400' : ''}`}>
                        <div 
                          onClick={() => toggleRecordExpand(r.id)}
                          className="p-3.5 flex flex-col sm:flex-row justify-between items-start sm:items-center text-xs gap-3 cursor-pointer active:bg-slate-50 md:hover:bg-slate-50 select-none"
                        >
                          <div className="flex items-center gap-2.5">
                            <span className={`w-5 h-5 rounded flex items-center justify-center font-bold text-[10px] ${isExpanded ? 'bg-blue-600 text-white' : 'bg-slate-100 text-slate-600'}`}>
                              {isExpanded ? '▲' : '▼'}
                            </span>
                            <div>
                              <div className="flex items-center gap-2 mb-0.5">
                                <span className="text-[10px] bg-slate-100 px-2 py-0.5 rounded font-mono text-slate-600 font-bold whitespace-nowrap">{r.date}</span>
                                {isHoliday ? (
                                    <span className="text-[10px] bg-amber-100 text-amber-800 px-2 py-0.5 rounded font-bold whitespace-nowrap">休假</span>
                                ) : (
                                    <>
                                        <span className="font-bold text-slate-900 text-sm whitespace-nowrap">{r.projectName}</span>
                                        {r.isCollected ? (
                                          <span className="text-[9px] bg-emerald-100 text-emerald-800 px-2 py-0.5 rounded font-bold whitespace-nowrap">已收款</span>
                                        ) : (
                                          <span className="text-[9px] bg-amber-100 text-amber-800 px-2 py-0.5 rounded font-bold whitespace-nowrap">未收款</span>
                                        )}
                                    </>
                                )}
                              </div>
                              {!isHoliday && (
                                <p className="text-[11px] text-slate-500 font-medium whitespace-nowrap">客戶：{r.client} | 請款：<strong className="text-emerald-600 font-bold">${(r.summary?.totalBilling || 0).toLocaleString()}</strong> | 成本：${(r.summary?.totalCost || 0).toLocaleString()}</p>
                              )}
                              {isHoliday && r.remarks && (
                                <p className="text-[11px] text-slate-500 font-medium">備註：{r.remarks}</p>
                              )}
                            </div>
                          </div>
                          
                          <div className="flex gap-1.5 w-full sm:w-auto justify-end" onClick={(e) => e.stopPropagation()}>
                            <button onClick={() => onEdit(r)} className="px-3 py-1 bg-blue-50 text-blue-600 hover:bg-blue-100 rounded text-xs font-semibold cursor-pointer whitespace-nowrap">編輯</button>
                            <button onClick={() => onDelete(r.id)} className="px-3 py-1 bg-rose-50 text-rose-600 hover:bg-rose-100 rounded text-xs font-semibold cursor-pointer whitespace-nowrap">刪除</button>
                          </div>
                        </div>

                        {/* 第三層：展開明細與照片 */}
                        {isExpanded && !isHoliday && (
                          <div className="p-3.5 bg-slate-50/70 border-t border-slate-100 space-y-3 text-[11px]">
                            <div className="grid grid-cols-2 sm:grid-cols-4 gap-2 bg-white p-2.5 rounded-lg border border-slate-200/80">
                              <div className="whitespace-nowrap"><span className="text-slate-400 block font-bold text-[10px]">工作時間</span><span className="font-bold text-slate-800">{r.startTime} ~ {r.endTime}</span></div>
                              <div className="whitespace-nowrap"><span className="text-slate-400 block font-bold text-[10px]">工作地點</span><span className="font-bold text-slate-800">{r.location || '無'}</span></div>
                              <div className="whitespace-nowrap"><span className="text-slate-400 block font-bold text-[10px]">請款日期</span><span className="font-bold text-slate-800">{r.billingDate || '未填'}</span></div>
                              <div className="whitespace-nowrap"><span className="text-slate-400 block font-bold text-[10px]">收款日期</span><span className="font-bold text-slate-800">{r.collectionDate || '未收款'}</span></div>
                            </div>

                            {r.personnel && r.personnel.length > 0 && (
                              <div>
                                <h6 className="font-bold text-slate-500 mb-1 uppercase text-[10px]">參與人員 ({r.personnel.length} 人)</h6>
                                <div className="space-y-1 overflow-x-auto hide-scrollbar">
                                  {r.personnel.map((p, idx) => (
                                    <div key={idx} className="bg-white p-2 rounded border border-slate-200 flex justify-between items-center whitespace-nowrap min-w-max gap-4">
                                      <span className="font-bold text-slate-800">{p.name} ({p.dayType === 'half' ? '半日' : '全日'})</span>
                                      <span className="font-semibold text-slate-600">日薪: <strong className="text-blue-600">${Number(p.dailyRate||0).toLocaleString()}</strong></span>
                                    </div>
                                  ))}
                                </div>
                              </div>
                            )}

                            {r.personnelExtras && r.personnelExtras.length > 0 && (
                              <div>
                                <h6 className="font-bold text-slate-500 mb-1 uppercase text-[10px]">其他人事費 ({r.personnelExtras.length} 筆)</h6>
                                <div className="space-y-1 overflow-x-auto hide-scrollbar">
                                  {r.personnelExtras.map((pe, idx) => (
                                      <div key={idx} className="bg-white p-2 rounded border border-slate-200 flex justify-between items-center whitespace-nowrap min-w-max gap-4">
                                        <span className="font-bold text-slate-800">{pe.name} ({pe.type})</span>
                                        <span className="font-semibold text-slate-600">金額: <strong className="text-amber-600">${Number(pe.amount||0).toLocaleString()}</strong></span>
                                      </div>
                                  ))}
                                </div>
                              </div>
                            )}

                            {r.tasks && r.tasks.length > 0 && (
                              <div>
                                <h6 className="font-bold text-slate-500 mb-1 uppercase text-[10px]">工作/工項內容</h6>
                                <div className="space-y-1 overflow-x-auto hide-scrollbar">
                                  {r.tasks.map((t, idx) => (
                                    <div key={idx} className="bg-white p-2 rounded border border-slate-200 flex justify-between items-center whitespace-nowrap min-w-max gap-4">
                                      <span className="font-bold text-slate-800">{t.description || '無描述'}</span>
                                      <span className="text-slate-600">工費: ${Number(t.laborCost||0).toLocaleString()} | 料費: ${Number(t.materialCost||0).toLocaleString()} {t.billable ? `| 請款: $${t.billingAmount}` : ''}</span>
                                    </div>
                                  ))}
                                </div>
                              </div>
                            )}

                            {r.customItems && r.customItems.length > 0 && (
                              <div>
                                <h6 className="font-bold text-slate-500 mb-1 uppercase text-[10px]">購買物品</h6>
                                <div className="space-y-1 overflow-x-auto hide-scrollbar">
                                  {r.customItems.map((c, idx) => (
                                    <div key={idx} className="bg-white p-2 rounded border border-slate-200 flex justify-between items-center whitespace-nowrap min-w-max gap-4">
                                      <span className="font-bold text-slate-800">{c.name} (數量: {c.qty})</span>
                                      <span className="text-slate-600">單價: ${Number(c.price||0).toLocaleString()} = <strong className="text-slate-800">${(Number(c.qty||0)*Number(c.price||0)).toLocaleString()}</strong></span>
                                    </div>
                                  ))}
                                </div>
                              </div>
                            )}

                            {r.costs && (Number(r.costs.fuel?.cost)||Number(r.costs.food?.cost)||Number(r.costs.other?.cost)) > 0 && (
                              <div>
                                <h6 className="font-bold text-slate-500 mb-1 uppercase text-[10px]">其他費用支出</h6>
                                <div className="grid grid-cols-3 gap-2 bg-white p-2 rounded border border-slate-200">
                                  <div className="whitespace-nowrap">加油錢: ${Number(r.costs.fuel?.cost||0).toLocaleString()}</div>
                                  <div className="whitespace-nowrap">餐費: ${Number(r.costs.food?.cost||0).toLocaleString()}</div>
                                  <div className="whitespace-nowrap">雜費: ${Number(r.costs.other?.cost||0).toLocaleString()}</div>
                                </div>
                              </div>
                            )}

                            {r.remarks && (
                              <div className="bg-white p-2 rounded border border-slate-200 text-slate-600">
                                <span className="font-bold text-slate-400 block text-[10px] uppercase">備註</span>
                                {r.remarks}
                              </div>
                            )}

                            {/* 修改：真正的第三層 - 照片專屬折疊面板 */}
                            {r.images && r.images.length > 0 && (
                              <div className="pt-2 mt-2 border-t border-slate-200/60">
                                <div 
                                  onClick={(e) => {
                                      e.stopPropagation();
                                      togglePhotoExpand(r.id);
                                  }}
                                  className="flex justify-between items-center bg-white p-2.5 rounded-lg border border-slate-200 shadow-sm cursor-pointer active:bg-slate-50 md:hover:bg-slate-50 transition-colors"
                                >
                                  <h6 className="font-bold text-slate-700 uppercase text-[11px] flex items-center gap-1.5">
                                    <span className="text-sm">📸</span> 現場照片 ({r.images.length} 張)
                                  </h6>
                                  <span className={`text-[10px] font-bold text-slate-500 bg-slate-100 w-5 h-5 flex items-center justify-center rounded transition-transform ${expandedPhotoIds[r.id] ? 'rotate-180' : ''}`}>
                                    ▼
                                  </span>
                                </div>
                                
                                {/* 第三層照片內容：點擊才展開 */}
                                {expandedPhotoIds[r.id] && (
                                  <div className="grid grid-cols-3 sm:grid-cols-4 md:grid-cols-5 gap-2 mt-2 p-2 bg-slate-200/40 rounded-lg border border-slate-200/60">

                                          <div 
                                              key={idx} 
                                              className="aspect-square border border-slate-300 rounded-lg overflow-hidden cursor-pointer active:border-blue-400 md:hover:border-blue-400 transition-colors shadow-sm bg-white"

                                                  e.stopPropagation();
                                                  setZoomedImage(img);
                                              }}
                                          >
                                              <img src={img} className="w-full h-full object-cover md:hover:scale-110 transition-transform duration-300" alt={`紀錄照片 ${idx+1}`} />
                                          </div>
                                      ))}
                                  </div>
                                )}
                              </div>
                            )}

                          </div>
                        )}
                        {/* 休假展開時僅顯示備註 */}
                        {isExpanded && isHoliday && r.remarks && (
                          <div className="p-3.5 bg-amber-50/70 border-t border-amber-100 text-[11px] text-amber-800">
                              <span className="font-bold block mb-1">備註：</span>
                              {r.remarks}
                          </div>
                        )}
                      </div>
                    );
                  })}
                  {displayList.length === 0 && <p className="text-center text-xs text-slate-400 py-8 bg-slate-50 rounded-xl border border-dashed border-slate-200 font-medium">所選日期無紀錄</p>}
                </div>
              </Card>
            </div>
          );
        }

        function StatsView({ records }) {
          const validRecords = records.filter(r => r.type !== 'quotation' && r.type !== 'holiday');
          const total = validRecords.reduce((acc, r) => ({ billing: acc.billing + (r.summary?.totalBilling || 0), cost: acc.cost + (r.summary?.totalCost || 0), profit: acc.profit + (r.summary?.profit || 0) }), { billing: 0, cost: 0, profit: 0 });
          return (
            <div className="space-y-4 max-w-4xl mx-auto">
              <div className="grid grid-cols-1 sm:grid-cols-3 gap-3 text-center">
                <Card><p className="text-[11px] text-slate-500 font-bold uppercase mb-1">總請款</p><p className="text-xl font-black whitespace-nowrap">${total.billing.toLocaleString()}</p></Card>
                <Card><p className="text-[11px] text-slate-500 font-bold uppercase mb-1">總成本</p><p className="text-xl font-black text-rose-600 whitespace-nowrap">${total.cost.toLocaleString()}</p></Card>
                <Card className="bg-blue-50/30 border-blue-200"><p className="text-[11px] text-blue-600 font-bold uppercase mb-1">總利潤</p><p className="text-xl font-black text-blue-700 whitespace-nowrap">${total.profit.toLocaleString()}</p></Card>
              </div>
            </div>
          );
        }

        function SettingsView({ settings, onSave, records, setRecords, showToast }) {
          const [form, setForm] = useState(settings);
          const [newName, setNewName] = useState('');
          const [newFullRate, setNewFullRate] = useState(2500);
          const [newHalfRate, setNewHalfRate] = useState(1300);
          const [importText, setImportText] = useState('');

          const handleFieldChange = (field, val) => setForm(prev => ({ ...prev, [field]: val }));

          const updatePersonRate = (index, field, rate) => {
            const updatedPersonnel = [...form.fixedPersonnel];
            updatedPersonnel[index] = { ...updatedPersonnel[index], [field]: Number(rate) || 0 };
            const updated = { ...form, fixedPersonnel: updatedPersonnel };
            setForm(updated);
            onSave(updated);
          };

          const addPerson = (e) => {
            e.preventDefault();
            if (!newName.trim()) return;
            const updated = { 
              ...form, 
              fixedPersonnel: [...form.fixedPersonnel, { name: newName.trim(), fullDayRate: Number(newFullRate) || 2500, halfDayRate: Number(newHalfRate) || 1300 }] 
            };
            setForm(updated);
            onSave(updated);
            setNewName('');
            setNewFullRate(2500);
            setNewHalfRate(1300);
          };

          const removePerson = (name) => {
            const updated = { ...form, fixedPersonnel: form.fixedPersonnel.filter(p => p.name !== name) };
            setForm(updated);
            onSave(updated);
          };

          const handleSaveSettings = (e) => {
            e.preventDefault();
            onSave(form);
          };

          const exportDataText = () => {
            const jsonStr = JSON.stringify({ records, settings });
            navigator.clipboard.writeText(jsonStr);
            showToast('備份代碼已成功複製到剪貼簿！可貼到 LINE 或備忘錄保存');
          };

          const importDataText = () => {
            if (!importText.trim()) {
              alert('請先貼上備份代碼文字');
              return;
            }
            try {
              const parsed = JSON.parse(importText.trim());
              if (parsed.records) setRecords(parsed.records);
              if (parsed.settings) {
                if (parsed.settings.fixedPersonnel && typeof parsed.settings.fixedPersonnel[0] === 'string') {
                  parsed.settings.fixedPersonnel = parsed.settings.fixedPersonnel.map(name => ({ name, fullDayRate: 2500, halfDayRate: 1300 }));
                }
                setForm(parsed.settings);
                onSave(parsed.settings);
              }
              showToast('資料還原成功！');
              setImportText('');
            } catch (err) {
              alert('備份代碼格式錯誤，請確認是否完整複製');
            }
          };

          return (
            <div className="space-y-4 max-w-2xl mx-auto">
              <Card title="公司/工作室抬頭設定 (用於請款單)">
                <form onSubmit={handleSaveSettings} className="space-y-3">
                  <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                    <div className="relative">
                      <label className="absolute -top-2 left-2.5 bg-white px-1 text-[10px] text-slate-500 font-bold">公司名稱</label>
                      <input type="text" value={form.companyName || ''} onChange={e => handleFieldChange('companyName', e.target.value)} className="w-full p-2.5 pt-3 text-xs border border-slate-200 rounded-lg outline-none bg-white font-medium" placeholder="例：順發工程行" />
                    </div>
                    <div className="relative">
                      <label className="absolute -top-2 left-2.5 bg-white px-1 text-[10px] text-slate-500 font-bold">統一編號</label>
                      <input type="text" value={form.taxId || ''} onChange={e => handleFieldChange('taxId', e.target.value)} className="w-full p-2.5 pt-3 text-xs border border-slate-200 rounded-lg outline-none bg-white font-medium" placeholder="例：12345678" />
                    </div>
                    <div className="relative">
                      <label className="absolute -top-2 left-2.5 bg-white px-1 text-[10px] text-slate-500 font-bold">聯絡電話</label>
                      <input type="text" value={form.phone || ''} onChange={e => handleFieldChange('phone', e.target.value)} className="w-full p-2.5 pt-3 text-xs border border-slate-200 rounded-lg outline-none bg-white font-medium" placeholder="例：0912-345678" />
                    </div>
                  </div>
                  <button type="submit" className="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded-lg text-xs font-semibold cursor-pointer whitespace-nowrap">儲存基本設定</button>
                </form>
              </Card>

              <Card title="固定班底與薪資管理">
                <div className="space-y-2.5 mb-4">
                  {form.fixedPersonnel.map((fp, index) => (
                    <div key={fp.name} className="flex flex-col sm:flex-row items-start sm:items-center justify-between bg-slate-50 p-3 rounded-lg border border-slate-200 text-xs gap-3">
                      <span className="font-bold text-slate-800 text-sm whitespace-nowrap">{fp.name}</span>
                      <div className="flex items-center gap-2 w-full sm:w-auto">
                        <div className="flex-1 relative">
                          <label className="absolute -top-2 left-2 bg-slate-50 px-0.5 text-[10px] text-slate-500 font-bold">全日薪</label>
                          <input 
                            type="number" 
                            value={fp.fullDayRate} 
                            onChange={(e) => updatePersonRate(index, 'fullDayRate', e.target.value)} 
                            className="w-full p-1.5 pt-1.5 border border-slate-200 rounded bg-white text-xs text-right outline-none font-bold" 
                          />
                        </div>
                        <div className="flex-1 relative">
                          <label className="absolute -top-2 left-2 bg-slate-50 px-0.5 text-[10px] text-slate-500 font-bold">半日薪</label>
                          <input 
                            type="number" 
                            value={fp.halfDayRate} 
                            onChange={(e) => updatePersonRate(index, 'halfDayRate', e.target.value)} 
                            className="w-full p-1.5 pt-1.5 border border-slate-200 rounded bg-white text-xs text-right outline-none font-bold" 
                          />
                        </div>
                        <button type="button" onClick={() => removePerson(fp.name)} className="text-rose-500 hover:bg-rose-100 p-1.5 rounded cursor-pointer" title="移除">
                          <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" /></svg>
                        </button>
                      </div>
                    </div>
                  ))}
                </div>

                <form onSubmit={addPerson} className="pt-3 border-t border-slate-200">
                  <h4 className="text-[11px] font-bold text-slate-600 uppercase mb-3">新增班底</h4>
                  <div className="flex flex-col sm:flex-row gap-2.5 mb-3">
                    <div className="flex-1 relative">
                      <label className="absolute -top-2 left-2.5 bg-white px-1 text-[10px] text-slate-500 font-bold">姓名</label>
                      <input type="text" value={newName} onChange={e => setNewName(e.target.value)} placeholder="姓名" className="w-full p-2.5 pt-3 text-xs border border-slate-200 rounded-lg outline-none bg-white" />
                    </div>
                    <div className="flex-1 relative">
                      <label className="absolute -top-2 left-2.5 bg-white px-1 text-[10px] text-slate-500 font-bold">全日薪</label>
                      <input type="number" value={newFullRate} onChange={e => setNewFullRate(e.target.value)} placeholder="2500" className="w-full p-2.5 pt-3 text-xs border border-slate-200 rounded-lg outline-none bg-white" />
                    </div>
                    <div className="flex-1 relative">
                      <label className="absolute -top-2 left-2.5 bg-white px-1 text-[10px] text-slate-500 font-bold">半日薪</label>
                      <input type="number" value={newHalfRate} onChange={e => setNewHalfRate(e.target.value)} placeholder="1300" className="w-full p-2.5 pt-3 text-xs border border-slate-200 rounded-lg outline-none bg-white" />
                    </div>
                  </div>
                  <button type="submit" className="bg-emerald-600 hover:bg-emerald-700 text-white px-4 py-2 rounded-lg text-xs font-semibold cursor-pointer whitespace-nowrap">新增班底</button>
                </form>
              </Card>

              <Card title="手機 App 專用備份與還原">
                <div className="space-y-3">
                  <p className="text-[11px] text-slate-500 leading-relaxed">
                    備份在手機上！
                  </p>
                  <button type="button" onClick={exportDataText} className="w-full bg-slate-900 hover:bg-slate-800 text-white py-2.5 rounded-xl text-xs font-bold cursor-pointer whitespace-nowrap">
                    📋 一鍵複製備份代碼
                  </button>
                  <div className="pt-2 border-t border-slate-100 space-y-2">
                    <label className="block text-[11px] font-bold text-slate-700">還原資料（請將備份代碼貼在下方）：</label>
                    <textarea 
                      rows="3" 
                      value={importText} 
                      onChange={e => setImportText(e.target.value)} 
                      placeholder="在此貼上剛剛複製的備份代碼文字..."
                      className="w-full p-2.5 text-xs border border-slate-200 rounded-xl outline-none font-mono"
                    ></textarea>
                    <button type="button" onClick={importDataText} className="w-full bg-blue-600 hover:bg-blue-700 text-white py-2.5 rounded-xl text-xs font-bold cursor-pointer whitespace-nowrap">
                      📥 執行還原資料
                    </button>
                  </div>
                </div>
              </Card>

            </div>
          );
        }

        ReactDOM.render(<App />, document.getElementById('root'));
    </script>
</body>
</html>
